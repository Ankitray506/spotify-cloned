[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NETLIFY_COLLABORATIVE_DRAFT = "false"
  NETLIFY_DRAWER_ENABLED = "false"

[[redirects]]
  from = "/api/*"
  to = "https://aura-3d-backend.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
